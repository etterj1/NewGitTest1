name: TaskHub
options:
  bundleIdPrefix: com.jasonetter
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_PREVIEWS: YES

targets:
  TaskHub-iOS:
    type: application
    platform: iOS
    sources:
      - path: TaskHub
        excludes:
          - "Resources/TaskHub-macOS.entitlements"
          - "Resources/Info-iOS.plist"
          - "Resources/Info-macOS.plist"
    info:
      path: TaskHub/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: TaskHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSRemindersFullAccessUsageDescription: TaskHub shows and edits your Reminders alongside tasks from your other apps.
        NSCalendarsFullAccessUsageDescription: TaskHub shows your upcoming events alongside your tasks.
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonetter.taskhub
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TaskHub-macOS:
    type: application
    platform: macOS
    sources:
      - path: TaskHub
        excludes:
          - "Resources/TaskHub-macOS.entitlements"
          - "Resources/Info-iOS.plist"
          - "Resources/Info-macOS.plist"
    info:
      path: TaskHub/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: TaskHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSRemindersFullAccessUsageDescription: TaskHub shows and edits your Reminders alongside tasks from your other apps.
        NSCalendarsFullAccessUsageDescription: TaskHub shows your upcoming events alongside your tasks.
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    entitlements:
      path: TaskHub/Resources/TaskHub-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonetter.taskhub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
